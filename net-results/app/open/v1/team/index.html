<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open team · Net Results</title>
  <style>
    :root { color-scheme: dark; --canvas: #180a04; --card: #200e06; --ink: #faf5ee; --green: #c9e52a; --line: rgba(194,98,45,0.3); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--canvas); color: var(--ink); font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 36rem; margin: 10vh auto; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
    h1 { line-height: 1.2; }
    a { color: var(--green); display: inline-block; min-height: 48px; padding: 12px 0; font-weight: 600; }
    a:focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>Net Results</p>
    <h1>Open team</h1>
    <p>This link opens a team in Net Results.</p>
    <p>If your app did not open, visit the Net Results website for download information.</p>
    <a href="/net-results/">Visit Net Results</a>
  </main>
</body>
</html>
