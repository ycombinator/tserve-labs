<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Net Results app QR code</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #fff; }
    body { display: grid; place-items: center; }
    img { display: block; width: min(100vw, 1080px); height: auto; max-height: 100vh; object-fit: contain; }
  </style>
</head>
<body>
  <img src="qr.svg" alt="QR code linking to https://tservelabs.com/net-results/" width="1080" height="1080">
</body>
</html>
